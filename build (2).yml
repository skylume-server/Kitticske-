name: Build APK es Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Fuggosegek telepitese
        run: npm install

      - name: Android projekt letrehozasa
        run: |
          npx cap add android
          npx cap sync android

      - name: Fekvo mod engedelyezese (erzekelo alapjan)
        run: |
          sed -i 's/<activity /<activity android:screenOrientation="sensor" /' android/app/src/main/AndroidManifest.xml

      - name: APK epitese
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Kitticskek-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: EXE epitese
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Kitticskek-Windows
          path: |
            dist/*.exe
